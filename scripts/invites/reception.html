<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hridee and Nyimul: Reception invitation</title>
    <!-- Same Google Fonts the site uses (layout.tsx). display=block: text waits for them, so the render never falls back. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Sans+3:wght@400..700&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="invite.css" />
  </head>
  <body>
    <!-- Sage panel: the saree. Photo: laughing by the ivy wall, cropped to the faces. -->
    <div class="card sage" style="--photo-h: 600px; --focus: 50% 42%">
      <img class="photo" src="../../app/(wedding)/_photos/events.jpg" alt="" />
      <div class="shade"></div>
      <!-- White monogram: the leaves behind it are dark. -->
      <img class="monogram on-dark" src="../../app/(wedding)/_photos/monogram-white.png" alt="" />

      <div class="title">
        <p class="eyebrow">Together with their families</p>
        <h1 class="names">Hridee <em>&amp;</em> Nyimul</h1>
        <p class="lead">invite you to celebrate their wedding</p>
      </div>

      <div class="panel">
        <div class="events">
          <div class="event">
            <h2>Reception</h2>
            <p class="when">Saturday, April 10, 2027 · 7:00 PM</p>
            <p class="where">Hilton Atlanta Northeast · Peachtree Corners, Georgia</p>
          </div>
        </div>

        <div class="rsvp">
          <div class="qr"></div>
          <p>Scan for details, directions and to RSVP<strong>nyimul.com/hridee</strong></p>
        </div>
      </div>

      <div class="frame"></div>
    </div>
  </body>
</html>
