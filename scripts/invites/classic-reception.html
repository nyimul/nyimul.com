<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hridee and Nyimul: Reception invitation (classic)</title>
    <!-- display=block: text waits for the fonts, so the render never falls back. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Pinyon+Script&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="classic.css" />
  </head>
  <body>
    <!-- Deep navy stock, ivory text, gold-foil names. data-fonts: what render-invites.mjs waits for. -->
    <div
      class="card midnight roomy"
      data-fonts='500 24px "Cormorant Garamond"|600 15px "Cormorant Garamond"|italic 400 23px "Cormorant Garamond"|400 72px "Pinyon Script"'
    >
      <div class="frame"></div>
      <div class="frame inner"></div>
      <img class="corner tl" src="classic-corner.svg" alt="" />
      <img class="corner tr" src="classic-corner.svg" alt="" />
      <img class="corner br" src="classic-corner.svg" alt="" />
      <img class="corner bl" src="classic-corner.svg" alt="" />

      <div class="inner">
        <div class="top">
          <div class="crest">
            <img src="classic-crest.svg" alt="" />
            <span class="initials">H &amp; N</span>
          </div>
          <p class="eyebrow">Together with their families</p>
          <h1 class="names">
            <span class="name">Hridee</span>
            <span class="amp">&amp;</span>
            <span class="name">Nyimul</span>
          </h1>
          <p class="lead">invite you to celebrate their wedding</p>
        </div>

        <div class="events">
          <img class="divider" src="classic-divider.svg" alt="" />
          <div class="event">
            <h2>Reception</h2>
            <p class="when">Saturday, April 10, 2027</p>
            <p class="time">at 7:00 PM</p>
            <p class="venue">Hilton Atlanta Northeast</p>
            <p class="city">Peachtree Corners, Georgia</p>
          </div>
        </div>

        <div class="rsvp">
          <img class="rule" src="classic-rule.svg" alt="" />
          <div class="qr"></div>
          <p>Scan for details, directions and to RSVP<strong>nyimul.com/hridee</strong></p>
        </div>
      </div>
    </div>
  </body>
</html>
